services:
  # Backend API
  - type: web
    name: rgb-pose-hub-api
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn --workers 1 --threads 4 --max-requests 100 --max-requests-jitter 10 --timeout 120 "app:create_app()"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rgb-pose-hub-db
          property: connectionString

  # Frontend Web Application
  - type: web
    name: rgb-pose-hub-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://rgb-pose-hub-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: rgb-pose-hub-db
    plan: free
    region: oregon
